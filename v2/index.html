<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FUN學 招生追蹤（介面2）</title>
<!--
  介面2：試用版排版。資料與後台和介面1（src/Index.html）完全相同，只換畫面。
  網址：https://yanrungyi.github.io/funrobot-leads/v2/
  主要差異：首頁是「今日待辦」、左邊清單＋右邊詳細資料（不再用滑出抽屜）、進度點一下就儲存、對話像聊天室。
-->
<style>
  :root {
    --brand: #f07b1d; --brand-dark: #c2410c; --brand-soft: #fff1e6;
    --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb; --bg: #f5f6f8; --card: #fff;
    --red: #b91c1c; --red-soft: #fef2f2; --blue: #1d4ed8; --blue-soft: #eff6ff; --green: #15803d; --green-soft: #f0fdf4;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; color: var(--ink); background: var(--bg); font-size: 15px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }

  .btn { border: 0; border-radius: 8px; padding: 9px 16px; background: var(--brand); color: #fff; font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 400; }
  .btn.small { padding: 5px 10px; font-size: 13px; }

  /* 登入 */
  #login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .login-box { background: var(--card); border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 340px; box-shadow: 0 8px 30px rgba(0,0,0,.06); text-align: center; }
  .login-box h1 { margin: 0 0 4px; font-size: 22px; color: var(--brand); }
  .login-box input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; margin: 18px 0 12px; text-align: center; letter-spacing: 2px; }
  .login-box .btn { width: 100%; padding: 12px; }
  .err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 8px; }

  /* 版面 */
  #app { height: 100%; display: flex; flex-direction: column; }
  .topbar { background: var(--card); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 4px; padding: 0 16px; height: 56px; flex: none; }
  .topbar .logo { font-weight: 700; color: var(--brand); margin-right: 16px; white-space: nowrap; }
  .tab { border: 0; background: none; height: 56px; padding: 0 14px; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
  .tab.on { color: var(--ink); font-weight: 700; border-bottom-color: var(--brand); }
  .tab .badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--red); color: #fff; font-size: 12px; line-height: 20px; text-align: center; }
  .tab .badge.zero { background: #d1d5db; }
  .topbar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; }

  .urgent { background: var(--red); color: #fff; padding: 10px 16px; flex: none; animation: pulse 2s ease-in-out infinite; }
  .urgent b { font-size: 16px; }
  .urgent .items { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .urgent button { background: #fff; color: var(--red); border: 0; border-radius: 6px; padding: 4px 10px; font-weight: 600; font-size: 13px; }
  @keyframes pulse { 0%, 100% { background: #b91c1c; } 50% { background: #dc2626; } }

  .layout { flex: 1; display: grid; grid-template-columns: minmax(340px, 440px) 1fr; min-height: 0; }
  .pane-list { border-right: 1px solid var(--line); overflow-y: auto; background: var(--bg); }
  .pane-detail { overflow-y: auto; background: var(--card); }

  /* 今日待辦 */
  .todo-head { padding: 16px 16px 4px; }
  .todo-head h2 { margin: 0; font-size: 18px; }
  .group { margin: 12px 12px 0; background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; }
  .group > .gh { padding: 10px 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
  .group > .gh small { font-weight: 400; color: var(--muted); }
  .group.g-urgent > .gh { background: var(--red-soft); color: var(--red); }
  .group.g-form > .gh { background: var(--brand-soft); color: var(--brand-dark); }
  .group.g-soon > .gh { background: #f5f3ff; color: #6d28d9; }
  .group.g-follow > .gh { background: #fffbeb; color: #92400e; }
  .group.g-inbox > .gh { background: var(--blue-soft); color: var(--blue); }
  .all-clear { text-align: center; padding: 48px 16px; color: var(--muted); }

  /* 清單列 */
  .row { display: block; width: 100%; text-align: left; background: var(--card); border: 0; border-bottom: 1px solid var(--line); padding: 10px 14px; }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: #fafafa; }
  .row.on { background: var(--brand-soft); box-shadow: inset 3px 0 0 var(--brand); }
  .row .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .row .name { font-weight: 700; }
  .row .name small { font-weight: 400; color: var(--muted); margin-left: 4px; font-size: 12px; }
  .row .time { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .row .why { font-size: 13px; margin-top: 2px; font-weight: 600; }
  .row .why.red { color: var(--red); } .row .why.orange { color: var(--brand-dark); } .row .why.amber { color: #92400e; } .row .why.purple { color: #6d28d9; } .row .why.blue { color: var(--blue); }
  .row .l3 { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .row .msg { color: var(--muted); font-size: 13px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-card { margin: 12px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; }

  .chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: #f3f4f6; color: #374151; }
  .chip.stage { font-weight: 600; }
  .s0 { background: #ffedd5; color: #c2410c; } .s1 { background: #dbeafe; color: #1d4ed8; } .s2 { background: #f3e8ff; color: #7e22ce; }
  .s3 { background: #ccfbf1; color: #0f766e; } .s4 { background: #dcfce7; color: #15803d; } .s5 { background: #f3f4f6; color: #6b7280; }
  .chip.kid { background: #fef3c7; color: #92400e; } .chip.course { background: #e0f2fe; color: #075985; }

  /* 新生名單篩選 */
  .filters { padding: 12px 12px 0; display: grid; gap: 8px; }
  .filters input, .filters select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .filters .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stage-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .stage-chips button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 12px; font-size: 13px; white-space: nowrap; }
  .stage-chips button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .stage-chips b { margin-left: 4px; }
  .count { padding: 8px 14px 0; font-size: 12px; color: var(--muted); }

  /* 詳細資料 */
  .empty-detail { height: 100%; display: flex; align-items: center; justify-content: center; color: var(--muted); padding: 24px; text-align: center; }
  .detail { max-width: 760px; margin: 0 auto; padding: 20px 24px 40px; }
  .d-head { display: flex; align-items: flex-start; gap: 12px; }
  .d-head h2 { margin: 0; font-size: 22px; }
  .d-head .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .d-head .close { margin-left: auto; border: 0; background: none; font-size: 24px; color: var(--muted); display: none; }
  .d-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .d-alert { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; }
  .d-alert.red { background: var(--red-soft); color: var(--red); } .d-alert.orange { background: var(--brand-soft); color: var(--brand-dark); } .d-alert.amber { background: #fffbeb; color: #92400e; }
  .section { margin-top: 22px; }
  .section > h3 { font-size: 13px; color: var(--muted); margin: 0 0 8px; font-weight: 600; letter-spacing: .5px; }

  .stepper { display: flex; gap: 0; }
  .stepper button { flex: 1; border: 1px solid var(--line); background: #fff; padding: 10px 4px; font-size: 13px; position: relative; color: var(--muted); }
  .stepper button + button { border-left: 0; }
  .stepper button:first-child { border-radius: 8px 0 0 8px; } .stepper button:last-child { border-radius: 0 8px 8px 0; }
  .stepper button.done { background: #fff7ed; color: var(--brand-dark); }
  .stepper button.cur { background: var(--brand); color: #fff; font-weight: 700; border-color: var(--brand); }
  .stage-extra { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .stage-extra button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 12px; color: var(--muted); }
  .stage-extra button.on { background: #6b7280; color: #fff; border-color: #6b7280; }

  .card { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .grid2 .full { grid-column: 1 / -1; }
  .field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .field input, .field select, .field textarea { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 14px; color: var(--ink); width: 100%; }
  .field textarea { min-height: 64px; resize: vertical; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--ink); }
  .checks label { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .save-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .ok { color: var(--green); font-size: 13px; }
  .hint { font-size: 12px; margin-top: 6px; }
  .hint.warn { color: #92400e; } .hint.good { color: var(--green); }
  .formbox { background: var(--brand-soft); border-color: #fcd5b5; line-height: 1.8; font-size: 14px; }
  .formbox a { color: var(--blue); font-weight: 600; }

  /* 對話 */
  .composer textarea { width: 100%; min-height: 72px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
  .composer .bar { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .composer select { padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .composer .bar .btn { margin-left: auto; }
  .confirm { margin-top: 8px; background: var(--brand-soft); border: 1px solid #fcd5b5; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  .confirm .bar { justify-content: flex-end; }
  .thread { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .bubble { max-width: 80%; padding: 8px 12px; border-radius: 14px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .bubble.in { background: #f3f4f6; align-self: flex-start; border-bottom-left-radius: 4px; }
  .bubble.out { background: #dcfce7; align-self: flex-end; border-bottom-right-radius: 4px; }
  .bubble .meta { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .pane-detail { position: fixed; inset: 0; z-index: 20; display: none; }
    .pane-detail.open { display: block; }
    .d-head .close { display: block; }
    .topbar { overflow-x: auto; padding: 0 8px; }
    .topbar .logo, .topbar .right .muted { display: none; }
    .detail { padding: 16px; }
    .grid2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<section id="login">
  <div class="login-box">
    <h1>FUN學 招生追蹤</h1>
    <div class="muted">放學機器人科技教育中心・介面2</div>
    <form id="login-form">
      <input id="pin" type="password" placeholder="請輸入密碼" autocomplete="current-password" required>
      <button class="btn" id="login-btn" type="submit">登入</button>
    </form>
    <div class="err" id="login-err"></div>
  </div>
</section>

<section id="app" class="hidden">
  <nav class="topbar">
    <span class="logo">FUN學 招生追蹤</span>
    <button class="tab on" data-view="todo">今日待辦<span class="badge" id="n-todo">0</span></button>
    <button class="tab" data-view="leads">新生名單</button>
    <button class="tab" data-view="inbox">在學訊息<span class="badge" id="n-inbox">0</span></button>
    <div class="right">
      <span class="muted" id="loaded-at"></span>
      <button class="btn ghost small" id="refresh">重新整理</button>
      <button class="btn ghost small" id="logout">登出</button>
    </div>
  </nav>
  <div class="urgent hidden" id="urgent"></div>
  <div class="layout">
    <section class="pane-list" id="pane-list">
      <!-- 今日待辦 -->
      <div id="view-todo">
        <div class="todo-head"><h2>今天要處理的事</h2><div class="muted" style="font-size:13px">由上到下依緊急程度排列，點名字看詳細資料</div></div>
        <div id="todo-groups"></div>
      </div>
      <!-- 新生名單 -->
      <div id="view-leads" class="hidden">
        <div class="filters">
          <input id="f-q" type="search" placeholder="🔍 搜尋家長、孩子、訊息">
          <div class="three">
            <select id="f-identity"></select>
            <select id="f-campus"></select>
            <select id="f-course"></select>
          </div>
          <div class="stage-chips" id="stage-chips"></div>
        </div>
        <div class="count" id="count"></div>
        <div class="list-card" id="lead-list"></div>
      </div>
      <!-- 在學訊息 -->
      <div id="view-inbox" class="hidden">
        <div class="todo-head"><h2>在學家長訊息</h2><div class="muted" style="font-size:13px">還沒從這裡回覆的訊息。貼圖、自動回應關鍵字不算。</div></div>
        <label class="count" style="display:block"><input type="checkbox" id="inbox-all"> 也顯示已處理的在學家長</label>
        <div class="list-card" id="inbox-list"></div>
      </div>
    </section>

    <section class="pane-detail" id="pane-detail">
      <div class="empty-detail" id="detail-empty">← 點左邊的家長，這裡會顯示詳細資料、進度和對話</div>
      <div class="detail hidden" id="detail">
        <div class="d-head">
          <div>
            <h2 id="d-name"></h2>
            <div class="sub" id="d-sub"></div>
          </div>
          <button class="close" id="d-close" aria-label="關閉">×</button>
        </div>
        <div class="d-tags" id="d-tags"></div>
        <div class="d-alert hidden" id="d-alert"></div>

        <div class="section">
          <h3>進度（點一下就會儲存）</h3>
          <div class="stepper" id="d-stepper"></div>
          <div class="stage-extra">
            <span class="muted" id="d-stage-msg"></span>
            <button id="d-stage-no">暫不報名</button>
          </div>
        </div>

        <div class="section">
          <h3>體驗課</h3>
          <div class="card">
            <div class="grid2">
              <label class="field">日期<input id="d-trial" type="date"></label>
              <label class="field">時間<input id="d-trial-time" type="time"></label>
            </div>
            <div class="hint" id="d-trial-src"></div>
            <div class="save-row"><button class="btn small" id="d-trial-save">儲存體驗課時間</button><span class="ok" id="d-trial-ok"></span><span class="err" id="d-trial-err"></span></div>
          </div>
        </div>

        <div class="section hidden" id="d-form-sec">
          <h3 id="d-form-title">體驗課表單資料</h3>
          <div class="card formbox" id="d-form"></div>
        </div>

        <div class="section">
          <h3>對話（最新在最上面）</h3>
          <div class="composer">
            <textarea id="r-text" placeholder="輸入要傳給家長的訊息，會以官方帳號傳到家長的 LINE…"></textarea>
            <div class="bar">
              回覆者
              <select id="r-sender"><option>顏老師</option><option>陳老師</option><option>雅鎂</option></select>
              <button class="btn" id="r-send">傳送</button>
            </div>
            <div class="confirm hidden" id="r-confirm">
              <div id="r-confirm-text"></div>
              <div class="bar"><button class="btn ghost small" id="r-cancel">取消</button><button class="btn small" id="r-ok">確定傳送</button></div>
            </div>
            <div class="hint muted" id="r-quota"></div>
            <div class="err" id="r-err"></div>
          </div>
          <div class="thread" id="d-thread"></div>
        </div>

        <div class="section">
          <h3>家長資料</h3>
          <div class="card">
            <div class="grid2">
              <label class="field">稱呼<input id="d-nickname" placeholder="例：小明媽媽"></label>
              <label class="field">孩子姓名（多位用「、」分隔）<input id="d-children"></label>
              <label class="field">身分<select id="d-identity"></select></label>
              <label class="field">校區<input id="d-campus" list="campus-list"></label>
              <label class="field">年齡<input id="d-age"></label>
              <div class="field full">課程類別<div class="checks" id="d-courses"></div></div>
              <label class="field full">備註<textarea id="d-note"></textarea></label>
            </div>
            <datalist id="campus-list"></datalist>
            <div class="save-row"><button class="btn small" id="d-save">儲存家長資料</button><span class="ok" id="d-ok"></span><span class="err" id="d-err"></span></div>
          </div>
        </div>
      </div>
    </section>
  </div>
</section>

<script>
  // 後台與介面1共用（Apps Script /exec），不帶 Google 登入資訊，多帳號也能用
  const API_URL = 'https://script.google.com/macros/s/AKfycbx3g7gPRtCO4Qy9XQ7TAVCTmbjOZ7YI6EmljX32Walpzi9rBI1RpAw9ve1G45WeJbbmcA/exec';
  const KEY = 'funrobot_leads_token';
  const DEFAULT_SENDER = '顏老師';
  const MAIN_STAGES = ['詢問中', '已回覆', '已約試聽', '已試聽', '已報名'];
  const DAY = 86400000, HOUR = 3600000, URGENT_HOURS = 12;
  const LEAD_VIEW = '__lead';
  const state = { data: null, view: 'todo', currentId: null, stageFilter: '' };
  const $ = (id) => document.getElementById(id);

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function getToken() { try { return sessionStorage.getItem(KEY); } catch (e) { return state.token; } }
  function setToken(t) { state.token = t; try { t ? sessionStorage.setItem(KEY, t) : sessionStorage.removeItem(KEY); } catch (e) {} }

  async function call(fn, ...args) {
    let data;
    try {
      const res = await fetch(API_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ api: fn, args }), credentials: 'omit', redirect: 'follow',
      });
      data = await res.json();
    } catch (err) {
      throw new Error('連線失敗，請檢查網路後再試一次');
    }
    if (data.error) {
      if (data.error.indexOf('SESSION_EXPIRED') >= 0) { showLogin('登入已過期，請重新登入'); throw new Error('登入已過期'); }
      throw new Error(data.error);
    }
    return data.result;
  }

  // ── 登入 ──
  function showLogin(msg) {
    setToken(null);
    $('app').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('login-err').textContent = msg || '';
    $('pin').focus();
  }
  $('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('login-btn').disabled = true;
    $('login-err').textContent = '';
    try {
      setToken(await call('login', $('pin').value));
      $('pin').value = '';
      await load();
    } catch (err) {
      $('login-err').textContent = err.message;
    } finally {
      $('login-btn').disabled = false;
    }
  });
  $('logout').addEventListener('click', () => showLogin());
  $('refresh').addEventListener('click', () => load());

  async function load() {
    $('refresh').disabled = true;
    try {
      state.data = await call('getLeads', getToken());
      $('login').classList.add('hidden');
      $('app').classList.remove('hidden');
      $('loaded-at').textContent = '更新於 ' + state.data.loadedAt;
      fillSelects();
      renderAll();
      if (state.currentId) renderDetail();
    } catch (err) {
      if (!$('app').classList.contains('hidden')) alert('讀取失敗：' + err.message);
      else if (err.message !== '登入已過期') $('login-err').textContent = '讀取失敗：' + err.message;
    } finally {
      $('refresh').disabled = false;
    }
  }

  // ── 規則（與介面1相同）──
  const lead = (id) => state.data.leads.find((x) => x.userId === id);
  const isWaiting = (l) => ['', '詢問中', '已回覆'].indexOf(l.stage) >= 0;
  const isHotForm = (l) => !!l.formTs && isWaiting(l);
  const parentProposed = (l) => l.trialSource === '家長提出' && isWaiting(l);
  const listOf = (s) => String(s || '').split(/[、,，\s]+/).filter(String);
  function todayStr(offset) {
    const t = new Date(Date.now() + (offset || 0) * DAY);
    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  }
  function trialText(l) {
    if (!l.trialDate) return '';
    const d = new Date(l.trialDate + 'T00:00:00');
    const md = isNaN(d) ? l.trialDate : `${d.getMonth() + 1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）`;
    return md + (l.trialTime ? ' ' + l.trialTime : '');
  }
  function urgentReason(l) {
    const now = Date.now();
    if (isWaiting(l) && (l.formTs || l.trialSource === '家長提出')) {
      const since = Math.max(l.formTs || 0, l.trialSource === '家長提出' ? (l.trialTs || l.lastTs || 0) : 0);
      const h = Math.floor((now - since) / HOUR);
      if (since && h >= URGENT_HOURS) return `體驗課預約 ${h} 小時沒有處理`;
    }
    if (l.stage === '已約試聽' && l.trialDate) {
      const h = Math.floor((now - new Date(`${l.trialDate}T${l.trialTime || '23:59'}:00`).getTime()) / HOUR);
      if (!isNaN(h) && h >= URGENT_HOURS) return `體驗課已過 ${h} 小時，請更新進度`;
    }
    return '';
  }
  function formReason(l) {
    if (isHotForm(l)) return `已填體驗課表單（${Math.floor((Date.now() - l.formTs) / HOUR)} 小時前），請聯絡家長安排`;
    if (parentProposed(l)) return `家長希望 ${trialText(l)} 體驗，請確認`;
    return '';
  }
  function followReason(l) {
    const age = l.stageTs ? Date.now() - l.stageTs : 0;
    const days = Math.floor(age / DAY);
    if (l.stage === '詢問中' && age > DAY) return `詢問中 ${days} 天沒有更新`;
    if (l.stage === '已回覆' && age > 3 * DAY) return `已回覆 ${days} 天，還沒約體驗`;
    if (l.stage === '已試聽') return days >= 1 ? `體驗後 ${days} 天，還沒確定報名` : '已體驗，請確認是否報名';
    if (l.stage === '已約試聽' && l.trialDate && l.trialDate < todayStr()) return '體驗日已過，請更新進度';
    if (l.identity === '未分類' && l.pendingCount) return `未分類，有 ${l.pendingCount} 則訊息，請確認身分`;
    return '';
  }
  /** 這位家長最需要注意的一件事：[文字, 顏色] */
  function topReason(l) {
    let r;
    if ((r = urgentReason(l))) return ['🚨 ' + r, 'red'];
    if ((r = formReason(l))) return ['🔥 ' + r, 'orange'];
    if ((r = followReason(l))) return ['⚠ ' + r, 'amber'];
    return ['', ''];
  }
  const priority = (l) => urgentReason(l) ? 3 : formReason(l) ? 2 : followReason(l) ? 1 : 0;

  // ── 共用畫面元件 ──
  function nameHtml(l) {
    return l.nickname ? `${esc(l.nickname)}<small>${esc(l.name)}</small>` : esc(l.name || '（未取得名稱）');
  }
  function stageChip(stage) {
    const i = state.data.stages.indexOf(stage);
    return stage ? `<span class="chip stage s${i}">${esc(stage)}</span>` : '';
  }
  function chips(l) {
    return [
      stageChip(l.stage),
      ...listOf(l.children).map((c) => `<span class="chip kid">👦 ${esc(c)}</span>`),
      ...listOf(l.courses).map((c) => `<span class="chip course">📚 ${esc(c)}</span>`),
      l.campus ? `<span class="chip">${esc(l.campus)}</span>` : '',
      l.age ? `<span class="chip">${esc(l.age)}</span>` : '',
      l.trialDate ? `<span class="chip">體驗 ${esc(trialText(l))}</span>` : '',
      l.friend === '已封鎖' ? '<span class="chip" style="background:#fee2e2;color:#b91c1c">已封鎖</span>' : '',
    ].join('');
  }
  /** 清單的一列。why：[文字, 顏色]；showMsg：顯示最後訊息 */
  function rowHtml(l, why, time, showMsg) {
    return `<button class="row ${state.currentId === l.userId ? 'on' : ''}" data-id="${esc(l.userId)}">
      <div class="l1"><span class="name">${nameHtml(l)}</span><span class="time">${esc(time || l.lastAt)}</span></div>
      ${why && why[0] ? `<div class="why ${why[1]}">${esc(why[0])}</div>` : ''}
      <div class="l3">${chips(l)}</div>
      ${showMsg ? `<div class="msg">${esc(showMsg)}</div>` : ''}
    </button>`;
  }

  function renderAll() {
    renderUrgent();
    renderTodo();
    renderLeads();
    renderInbox();
  }

  // ── 紅色警示橫幅 ──
  function renderUrgent() {
    const items = state.data.leads.filter((l) => urgentReason(l)).sort((a, b) => b.lastTs - a.lastTs);
    $('urgent').classList.toggle('hidden', !items.length);
    $('urgent').innerHTML = items.length
      ? `<b>🚨 ${items.length} 位家長的體驗課超過 ${URGENT_HOURS} 小時沒有處理</b><div class="items">${items.map((l) =>
          `<button data-id="${esc(l.userId)}">${esc(l.nickname || l.name)}・${esc(urgentReason(l))}</button>`).join('')}</div>`
      : '';
  }

  // ── 今日待辦 ──
  function renderTodo() {
    const leads = state.data.leads;
    const used = new Set();
    const take = (list) => list.filter((l) => !used.has(l.userId) && used.add(l.userId));
    const byNewest = (a, b) => b.lastTs - a.lastTs;
    const today = todayStr(), tomorrow = todayStr(1);
    const groups = [
      { cls: 'g-urgent', title: '🚨 緊急：超過 12 小時沒處理', color: 'red',
        items: take(leads.filter((l) => urgentReason(l)).sort(byNewest)), why: urgentReason },
      { cls: 'g-form', title: '🔥 待安排體驗課', color: 'orange', note: '家長填了表單或提出時間',
        items: take(leads.filter((l) => formReason(l)).sort(byNewest)), why: formReason },
      { cls: 'g-soon', title: '📅 今天、明天的體驗課', color: 'purple',
        items: take(leads.filter((l) => l.stage === '已約試聽' && (l.trialDate === today || l.trialDate === tomorrow))
          .sort((a, b) => (a.trialDate + a.trialTime).localeCompare(b.trialDate + b.trialTime))),
        why: (l) => `${l.trialDate === today ? '今天' : '明天'} ${trialText(l)} 體驗` },
      { cls: 'g-follow', title: '⚠ 待追蹤新生', color: 'amber',
        items: take(leads.filter((l) => l.identity !== '在學' && followReason(l)).sort(byNewest)), why: followReason },
      { cls: 'g-inbox', title: '💬 在學家長待回覆', color: 'blue',
        items: take(leads.filter((l) => l.identity === '在學' && l.pendingCount).sort((a, b) => b.pendingTs - a.pendingTs)),
        why: (l) => `${l.pendingCount} 則訊息待回覆：${l.pendingPreview}` },
    ];
    const total = groups.reduce((n, g) => n + g.items.length, 0);
    $('n-todo').textContent = total;
    $('n-todo').classList.toggle('zero', !total);
    $('todo-groups').innerHTML = total
      ? groups.filter((g) => g.items.length).map((g) => `
        <div class="group ${g.cls}">
          <div class="gh"><span>${g.title}</span><small>${g.items.length} 位${g.note ? '・' + g.note : ''}</small></div>
          ${g.items.map((l) => rowHtml(l, [g.why(l), g.color])).join('')}
        </div>`).join('')
      : '<div class="all-clear">🎉 目前沒有待辦事項</div>';
  }

  // ── 新生名單 ──
  function fillSelects() {
    const d = state.data;
    const keep = (id, html, def) => { const v = $(id).value; $(id).innerHTML = html; $(id).value = v || def; if ($(id).selectedIndex < 0) $(id).value = def; };
    keep('f-identity', `<option value="${LEAD_VIEW}">問課＋未分類</option><option value="">全部身分</option>` +
      d.identities.map((v) => `<option>${esc(v)}</option>`).join(''), LEAD_VIEW);
    keep('f-campus', '<option value="">全部校區</option>' + d.campuses.map((v) => `<option>${esc(v)}</option>`).join(''), '');
    keep('f-course', '<option value="">全部課程</option>' + (d.courses || []).map((v) => `<option>${esc(v)}</option>`).join(''), '');
    $('d-identity').innerHTML = d.identities.map((v) => `<option>${esc(v)}</option>`).join('');
    $('campus-list').innerHTML = d.campuses.map((c) => `<option value="${esc(c)}">`).join('');
  }
  ['f-identity', 'f-campus', 'f-course'].forEach((id) => $(id).addEventListener('change', renderLeads));
  $('f-q').addEventListener('input', renderLeads);

  function baseLeads() {
    const idf = $('f-identity').value, cf = $('f-campus').value, co = $('f-course').value;
    const q = $('f-q').value.trim().toLowerCase();
    return state.data.leads.filter((l) =>
      (idf === LEAD_VIEW ? (l.identity === '問課' || l.identity === '未分類') : (!idf || l.identity === idf)) &&
      (!cf || l.campus.indexOf(cf) >= 0) &&
      (!co || listOf(l.courses).indexOf(co) >= 0) &&
      (!q || [l.nickname, l.children, l.name, l.lastMessage, l.note, l.age].join(' ').toLowerCase().indexOf(q) >= 0));
  }

  function renderLeads() {
    const base = baseLeads();
    const stages = [['', '全部'], ['__todo', '需處理'], ...state.data.stages.map((s) => [s, s])];
    $('stage-chips').innerHTML = stages.map(([v, label]) => {
      const n = v === '' ? base.length : v === '__todo' ? base.filter((l) => priority(l)).length : base.filter((l) => l.stage === v).length;
      return `<button class="${state.stageFilter === v ? 'on' : ''}" data-s="${esc(v)}">${esc(label)}<b>${n}</b></button>`;
    }).join('');
    const sf = state.stageFilter;
    const rows = base
      .filter((l) => !sf || (sf === '__todo' ? priority(l) : l.stage === sf))
      .sort((a, b) => priority(b) - priority(a) || b.lastTs - a.lastTs);
    $('count').textContent = `共 ${rows.length} 位；需處理的排前面，其餘依最後訊息時間（最新在最上面）`;
    $('lead-list').innerHTML = rows.length
      ? rows.map((l) => rowHtml(l, topReason(l), l.lastAt, l.lastMessage)).join('')
      : '<div class="all-clear">沒有符合條件的家長</div>';
  }
  $('stage-chips').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    state.stageFilter = state.stageFilter === b.dataset.s ? '' : b.dataset.s;
    renderLeads();
  });

  // ── 在學訊息 ──
  function renderInbox() {
    const enrolled = state.data.leads.filter((l) => l.identity === '在學');
    const pending = enrolled.filter((l) => l.pendingCount).sort((a, b) => b.pendingTs - a.pendingTs);
    const handled = enrolled.filter((l) => !l.pendingCount).sort((a, b) => b.lastTs - a.lastTs);
    $('n-inbox').textContent = pending.length;
    $('n-inbox').classList.toggle('zero', !pending.length);
    const rows = $('inbox-all').checked ? pending.concat(handled) : pending;
    $('inbox-list').innerHTML = rows.length
      ? rows.map((l) => l.pendingCount
          ? rowHtml(l, [`💬 ${l.pendingCount} 則待回覆`, 'blue'], l.pendingAt, l.pendingPreview)
          : rowHtml(l, ['✓ 已處理' + (l.lastReplyAt ? '・最後回覆 ' + l.lastReplyAt : ''), ''], l.lastAt, l.lastMessage)).join('')
      : '<div class="all-clear">在學家長的訊息都已處理 👍</div>';
  }
  $('inbox-all').addEventListener('change', renderInbox);

  // ── 切換分頁、點清單 ──
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
    state.view = t.dataset.view;
    document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === t));
    ['todo', 'leads', 'inbox'].forEach((v) => $('view-' + v).classList.toggle('hidden', v !== state.view));
  }));
  [$('pane-list'), $('urgent')].forEach((el) => el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-id]');
    if (b) openDetail(b.dataset.id);
  }));

  // ── 詳細資料 ──
  function openDetail(userId) {
    state.currentId = userId;
    $('r-text').value = '';
    $('r-sender').value = DEFAULT_SENDER;
    $('r-err').textContent = '';
    hideConfirm();
    ['d-ok', 'd-err', 'd-trial-ok', 'd-trial-err', 'd-stage-msg'].forEach((id) => { $(id).textContent = ''; });
    renderDetail();
    renderAll(); // 更新清單選取狀態
    $('pane-detail').classList.add('open');
    $('pane-detail').scrollTop = 0;
    loadThread(userId);
    loadQuota();
  }
  $('d-close').addEventListener('click', () => $('pane-detail').classList.remove('open'));

  function renderDetail() {
    const l = lead(state.currentId);
    $('detail-empty').classList.toggle('hidden', !!l);
    $('detail').classList.toggle('hidden', !l);
    if (!l) return;
    $('d-name').innerHTML = esc(l.nickname || l.name || '（未取得名稱）');
    $('d-sub').textContent = `LINE：${l.name || '—'}・${l.identity}・最後訊息 ${l.lastAt}`;
    $('d-tags').innerHTML = chips(l);
    const [why, color] = topReason(l);
    $('d-alert').className = 'd-alert ' + color + (why ? '' : ' hidden');
    $('d-alert').textContent = why;

    // 進度
    const cur = MAIN_STAGES.indexOf(l.stage);
    $('d-stepper').innerHTML = MAIN_STAGES.map((s, i) =>
      `<button data-s="${s}" class="${i === cur ? 'cur' : i < cur ? 'done' : ''}">${i < cur ? '✓ ' : ''}${s}</button>`).join('');
    $('d-stage-no').classList.toggle('on', l.stage === '暫不報名');

    // 體驗課
    $('d-trial').value = l.trialDate || '';
    $('d-trial-time').value = l.trialTime || '';
    const src = $('d-trial-src');
    if (l.trialDate && l.trialSource === '家長提出') { src.className = 'hint warn'; src.textContent = '⚠ 這是家長在訊息裡提出的時間，還沒確認。確認後在下方回覆家長（例：幫您安排 11/8 下午2點 體驗課），進度會自動改成已約試聽。'; }
    else if (l.trialDate && l.trialSource === '網頁回覆') { src.className = 'hint good'; src.textContent = '✓ 時間取自網頁回覆家長的內容'; }
    else { src.className = 'hint muted'; src.textContent = l.trialDate ? '' : '從這裡回覆家長時寫上體驗課時間，會自動填入。'; }

    // 表單
    $('d-form-sec').classList.toggle('hidden', !l.form);
    if (l.form) {
      $('d-form-title').textContent = `🔥 體驗課表單資料（${l.formAt} 收到）`;
      $('d-form').innerHTML = l.form.split('\n').map((line) => {
        const m = line.match(/^(.*?(?:電話|手機))：(.*)$/);
        return m ? `<div>${esc(m[1])}：<a href="tel:${esc(m[2].replace(/[^\d+]/g, ''))}">${esc(m[2])} 📞</a></div>` : `<div>${esc(line)}</div>`;
      }).join('');
    }

    // 家長資料
    $('d-nickname').value = l.nickname;
    $('d-children').value = l.children || '';
    $('d-identity').value = l.identity;
    $('d-campus').value = l.campus;
    $('d-age').value = l.age;
    $('d-note').value = l.note;
    $('d-courses').innerHTML = (state.data.courses || []).map((c) =>
      `<label><input type="checkbox" value="${esc(c)}" ${listOf(l.courses).indexOf(c) >= 0 ? 'checked' : ''}> ${esc(c)}</label>`).join('');
  }

  /** 存到後台，更新本機資料並重畫畫面。 */
  async function save(changes, okId, errId, okText) {
    const l = lead(state.currentId);
    $(errId).textContent = '';
    $(okId).textContent = '儲存中…';
    try {
      const updated = await call('updateLead', getToken(), l.userId, changes);
      Object.assign(l, updated);
      $(okId).textContent = okText || '已儲存 ✓';
      renderDetail();
      renderAll();
    } catch (err) {
      $(okId).textContent = '';
      $(errId).textContent = err.message;
    }
  }

  $('d-stepper').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) save({ stage: b.dataset.s }, 'd-stage-msg', 'd-stage-msg', `進度已改成「${b.dataset.s}」✓`);
  });
  $('d-stage-no').addEventListener('click', () => {
    const l = lead(state.currentId);
    const stage = l.stage === '暫不報名' ? '詢問中' : '暫不報名';
    save({ stage }, 'd-stage-msg', 'd-stage-msg', `進度已改成「${stage}」✓`);
  });
  $('d-trial-save').addEventListener('click', () =>
    save({ trialDate: $('d-trial').value, trialTime: $('d-trial-time').value }, 'd-trial-ok', 'd-trial-err'));
  $('d-save').addEventListener('click', () => save({
    nickname: $('d-nickname').value,
    children: $('d-children').value,
    identity: $('d-identity').value,
    campus: $('d-campus').value,
    age: $('d-age').value,
    courses: [...document.querySelectorAll('#d-courses input:checked')].map((x) => x.value).join('、'),
    note: $('d-note').value,
  }, 'd-ok', 'd-err'));

  // ── 對話 ──
  async function loadThread(userId) {
    $('d-thread').innerHTML = '<div class="muted">讀取中…</div>';
    try {
      const msgs = await call('getMessages', getToken(), userId);
      if (state.currentId !== userId) return;
      $('d-thread').innerHTML = msgs.length ? msgs.map((m) => `
        <div class="bubble ${m.outgoing ? 'out' : 'in'}"><span class="meta">${m.outgoing ? '↩ ' + esc(m.sender || '網頁回覆') + '・' : ''}${esc(m.at)}</span>${esc(m.content)}</div>`).join('')
        : '<div class="muted">還沒有訊息紀錄</div>';
    } catch (err) {
      $('d-thread').innerHTML = `<div class="err">讀取失敗：${esc(err.message)}</div>`;
    }
  }

  async function loadQuota() {
    if (state.quota === undefined) {
      try { state.quota = await call('getQuota', getToken()); } catch (e) { state.quota = null; }
    }
    const q = state.quota;
    $('r-quota').textContent = (q ? `本月已用 ${q.used}${q.limited ? '／' + q.limit : ''} 則 LINE 訊息。` : '') +
      '從這裡回覆用掉 1 則；在 LINE 官方帳號後台聊天回覆不計。';
  }

  $('r-send').addEventListener('click', () => {
    const l = lead(state.currentId);
    if (!l) return;
    $('r-err').textContent = '';
    if (!$('r-text').value.trim()) { $('r-err').textContent = '請輸入要傳送的內容'; $('r-text').focus(); return; }
    $('r-confirm-text').textContent = `確定以官方帳號、${$('r-sender').value} 的名義，傳送給「${l.nickname || l.name}」？`;
    $('r-confirm').classList.remove('hidden');
    $('r-send').disabled = true;
  });
  function hideConfirm() {
    $('r-confirm').classList.add('hidden');
    $('r-send').disabled = false;
  }
  $('r-cancel').addEventListener('click', hideConfirm);
  $('r-ok').addEventListener('click', async () => {
    const id = state.currentId;
    $('r-ok').disabled = true;
    $('r-ok').textContent = '傳送中…';
    try {
      await call('sendReply', getToken(), id, $('r-text').value.trim(), $('r-sender').value);
      $('r-text').value = '';
      state.quota = undefined;
      await load(); // 回覆提到體驗課時間會自動改成已約試聽
      loadThread(id);
      loadQuota();
    } catch (err) {
      $('r-err').textContent = err.message;
    } finally {
      $('r-ok').disabled = false;
      $('r-ok').textContent = '確定傳送';
      hideConfirm();
    }
  });

  if (getToken()) load().catch(() => showLogin()); else showLogin();
</script>
</body>
</html>
